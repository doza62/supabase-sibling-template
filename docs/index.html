<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Sibling Manager</title>
<style>
:root {
  --bg: #0f1117;
  --panel: #1a1d27;
  --panel-hi: #232733;
  --border: #2a2e3a;
  --text: #e4e6eb;
  --muted: #8b8f9b;
  --accent: #3ecf8e;
  --danger: #ff6b6b;
  --warn: #fbbf24;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --sidebar-w: 280px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
}

/* ─── Sidebar ─────────────────────────────────────────────── */
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sidebar-header h1 {
  font-size: 1rem;
  font-weight: 600;
}
.sidebar-header .logo {
  width: 24px; height: 24px;
  background: var(--accent);
  border-radius: 6px;
  display: grid; place-items: center;
  color: var(--bg);
  font-weight: 700;
}
.new-btn {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  font-weight: 600;
  cursor: pointer;
  margin: 12px 16px;
  font-size: 0.85rem;
}
.new-btn:hover { filter: brightness(1.1); }
.project-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px;
}
.project-item {
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.project-item:hover { background: var(--panel-hi); }
.project-item.active {
  background: var(--panel-hi);
  border-color: var(--accent);
}
.project-item .status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.project-item .name {
  flex: 1;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.project-item .meta {
  font-size: 0.7rem;
  color: var(--muted);
}
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.sidebar-footer button {
  flex: 1;
  background: var(--panel-hi);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px;
  font-size: 0.8rem;
  cursor: pointer;
}
.sidebar-footer button:hover { background: var(--border); }
.sidebar-footer button.warn { color: var(--warn); }

/* ─── Main ────────────────────────────────────────────────── */
.main {
  height: 100vh;
  overflow-y: auto;
  padding: 24px 32px;
}
.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.main-header h2 {
  font-size: 1.4rem;
}
.main-header .actions {
  display: flex;
  gap: 8px;
}

/* ─── Sections ────────────────────────────────────────────── */
.section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
.section.hostnames { border-left: 3px solid var(--blue); }
.section.shared { border-left: 3px solid var(--accent); }
.section.sibling { border-left: 3px solid var(--warn); }
.section.urls { border-left: 3px solid var(--purple); }
.section.output { border-left: 3px solid var(--purple); }
.section h3 {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section h3 .badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
}
.badge.ok { background: rgba(62, 207, 142, 0.2); color: var(--accent); }
.badge.warn { background: rgba(251, 191, 36, 0.2); color: var(--warn); }
.badge.bad { background: rgba(255, 107, 107, 0.2); color: var(--danger); }
.badge.info { background: rgba(96, 165, 250, 0.2); color: var(--blue); }

/* ─── Form ────────────────────────────────────────────────── */
.field {
  display: grid;
  grid-template-columns: 220px 1fr auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}
.field label {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
  color: var(--muted);
}
.field input {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.85rem;
  width: 100%;
}
.field input:focus { outline: 1px solid var(--accent); }
.field input.auto {
  background: rgba(251, 191, 36, 0.05);
  border-color: rgba(251, 191, 36, 0.3);
}
.field input.overridden {
  background: rgba(62, 207, 142, 0.05);
  border-color: rgba(62, 207, 142, 0.3);
}
.field .hint-icon {
  font-size: 0.85rem;
  color: var(--muted);
  width: 20px;
  text-align: center;
}
.field .hint-icon.warn { color: var(--warn); }
.field .hint-icon.ok { color: var(--accent); }

/* ─── Live Preview ────────────────────────────────────────── */
.preview {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  margin-top: 10px;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
}
.preview .line {
  display: grid;
  grid-template-columns: 220px 1fr;
  padding: 3px 0;
  border-bottom: 1px dashed var(--border);
}
.preview .line:last-child { border-bottom: none; }
.preview .key { color: var(--blue); }
.preview .val { color: var(--text); word-break: break-all; }
.preview .val.empty { color: var(--danger); font-style: italic; }
.preview .val.auto { color: var(--warn); }
.preview .val.override { color: var(--accent); }

/* ─── Output ──────────────────────────────────────────────── */
textarea.output {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
  min-height: 280px;
  resize: vertical;
}

/* ─── Buttons ─────────────────────────────────────────────── */
button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.85rem;
}
button:hover { filter: brightness(1.1); }
button.secondary { background: var(--panel-hi); color: var(--text); border: 1px solid var(--border); }
button.danger { background: var(--danger); }
button.warn { background: var(--warn); color: var(--bg); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ─── Modal ───────────────────────────────────────────────── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  width: 90%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 { margin-bottom: 16px; }
.modal textarea {
  width: 100%;
  min-height: 240px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
  resize: vertical;
}

/* ─── Health Pill ─────────────────────────────────────────── */
.health-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
}
.health-pill.live { background: rgba(62, 207, 142, 0.2); color: var(--accent); }
.health-pill.dead { background: rgba(255, 107, 107, 0.2); color: var(--danger); }
.health-pill.unknown { background: rgba(139, 143, 155, 0.2); color: var(--muted); }
.health-pill.checking { background: rgba(251, 191, 36, 0.2); color: var(--warn); }

/* ─── Empty State ─────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 64px 32px;
  color: var(--muted);
}
.empty-state h2 { color: var(--text); margin-bottom: 8px; }
.empty-state p { margin-bottom: 20px; }

/* ─── Toast ───────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--accent);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.85rem;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ─── Misc ────────────────────────────────────────────────── */
.kv-list {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
}
.kv-list .row {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 8px;
  padding: 4px 0;
  border-bottom: 1px dashed var(--border);
}
.kv-list .row:last-child { border-bottom: none; }
.kv-list .key { color: var(--blue); }
.kv-list .val { color: var(--text); word-break: break-all; }
.kv-list .val.empty { color: var(--danger); font-style: italic; }
.hint { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }

@media (max-width: 800px) {
  body { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="logo">S</div>
      <h1>Sibling Manager</h1>
    </div>
  </div>
  <button class="new-btn" onclick="newProject()">+ New Project</button>
  <div class="project-list" id="projectList"></div>
  <div class="sidebar-footer">
    <button onclick="openHubModal()">Hub Config</button>
    <button class="warn" onclick="clearAll()">Reset</button>
  </div>
</aside>

<main class="main" id="main"></main>

<div class="modal-bg" id="hubModal">
  <div class="modal">
    <h2>Hub Configuration</h2>
    <p class="hint" style="margin-bottom:12px;">Paste env vars from hub's Coolify Environment tab. Values are stored locally.</p>
    <textarea id="hubInput" placeholder="SERVICE_PASSWORD_POSTGRES=...&#10;SERVICE_PASSWORD_JWT=...&#10;POSTGRES_HOSTNAME=supabase-mobile-apps-...-db&#10;..."></textarea>
    <div class="btn-row">
      <button onclick="saveHub()">Save Hub Config</button>
      <button class="secondary" onclick="closeHubModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ─────────────────────────────────────────────────
let state = {
  hub: { hostnames: {}, shared: {}, other: {} },
  projects: [],
  currentId: null,
  urlPattern: 'https://api.{slug}.5sites.co',
  sitePattern: 'https://app.{slug}.5sites.co'
};

const HOSTNAME_KEYS = ['POSTGRES_HOSTNAME', 'MINIO_HOSTNAME', 'ANALYTICS_HOSTNAME'];
const SHARED_KEYS = [
  'SERVICE_PASSWORD_POSTGRES', 'SERVICE_PASSWORD_JWT',
  'SERVICE_SUPABASEANON_KEY', 'SERVICE_SUPABASESERVICE_KEY',
  'SERVICE_PASSWORD_PGMETACRYPTO',
  'SERVICE_USER_MINIO', 'SERVICE_PASSWORD_MINIO',
  'SERVICE_PASSWORD_LOGFLARE', 'SERVICE_PASSWORD_LOGFLAREPRIVATE',
  'SECRET_PASSWORD_REALTIME',
  'OPENAI_API_KEY', 'SMTP_ADMIN_EMAIL', 'SMTP_HOST', 'SMTP_PORT',
  'SMTP_USER', 'SMTP_PASS', 'SMTP_SENDER_NAME'
];
const AUTO_KEYS = ['POSTGRES_DB', 'STUDIO_DEFAULT_PROJECT', 'STORAGE_TENANT_ID', 'SERVICE_USER_ADMIN'];
const OVERRIDE_KEYS = ['API_EXTERNAL_URL', 'GOTRUE_SITE_URL', 'SERVICE_PASSWORD_ADMIN', 'ADDITIONAL_REDIRECT_URLS'];

// ─── Persistence ───────────────────────────────────────────
function save() {
  localStorage.setItem('supa-sibling-manager', JSON.stringify(state));
}
function load() {
  const raw = localStorage.getItem('supa-sibling-manager');
  if (raw) {
    try { state = {...state, ...JSON.parse(raw)}; } catch(e) { console.warn('Load failed', e); }
  }
}

// ─── Hub Config ────────────────────────────────────────────
function parseEnv(text) {
  const result = {};
  (text || '').split('\n').forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    const eq = line.indexOf('=');
    if (eq < 0) return;
    const key = line.slice(0, eq).trim();
    let val = line.slice(eq + 1).trim();
    if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
      val = val.slice(1, -1);
    }
    result[key] = val;
  });
  return result;
}
function categorizeHub(all) {
  const hub = { hostnames: {}, shared: {}, other: {} };
  Object.entries(all).forEach(([k, v]) => {
    if (HOSTNAME_KEYS.includes(k)) hub.hostnames[k] = v;
    else if (SHARED_KEYS.includes(k)) hub.shared[k] = v;
    else if (!k.startsWith('SERVICE_URL_') && !k.startsWith('SERVICE_FQDN_') && !AUTO_KEYS.includes(k) && !OVERRIDE_KEYS.includes(k)) {
      hub.other[k] = v;
    }
  });
  return hub;
}
function openHubModal() {
  const text = Object.entries({...state.hub.hostnames, ...state.hub.shared, ...state.hub.other})
    .map(([k,v]) => `${k}=${v}`).join('\n');
  document.getElementById('hubInput').value = text;
  document.getElementById('hubModal').classList.add('show');
}
function closeHubModal() {
  document.getElementById('hubModal').classList.remove('show');
}
function saveHub() {
  const text = document.getElementById('hubInput').value;
  const all = parseEnv(text);
  state.hub = categorizeHub(all);
  save();
  closeHubModal();
  render();
  toast('Hub config saved');
}

// ─── Project CRUD ──────────────────────────────────────────
function newProject() {
  const proj = {
    id: 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: 'New Project',
    slug: 'new',
    overrides: {},
    publicUrls: { kong: '', studio: '' },
    health: { kong: 'unknown', studio: 'unknown' },
    healthAt: null,
    deployedAt: null,
    createdAt: new Date().toISOString()
  };
  state.projects.push(proj);
  state.currentId = proj.id;
  save();
  render();
}
function deleteProject(id) {
  if (!confirm('Delete this project? Cannot undo.')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  if (state.currentId === id) state.currentId = state.projects[0]?.id || null;
  save();
  render();
}
function selectProject(id) {
  state.currentId = id;
  render();
}

// ─── Project Auto-Generation ───────────────────────────────
function slugify(name) {
  return (name || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-+/g, '-') || 'project';
}
function getAutoValue(key, proj) {
  const slug = proj.slug || slugify(proj.name);
  switch(key) {
    case 'POSTGRES_DB': return slug;
    case 'STUDIO_DEFAULT_PROJECT': return proj.name;
    case 'STORAGE_TENANT_ID': return slug;
    case 'SERVICE_USER_ADMIN': return `${slug}_admin`;
    default: return '';
  }
}
function getOverrideOrAuto(key, proj) {
  if (proj.overrides[key] !== undefined && proj.overrides[key] !== '') return proj.overrides[key];
  if (AUTO_KEYS.includes(key)) return getAutoValue(key, proj);
  if (key === 'API_EXTERNAL_URL') return state.urlPattern.replace('{slug}', proj.slug || slugify(proj.name));
  if (key === 'GOTRUE_SITE_URL') return state.sitePattern.replace('{slug}', proj.slug || slugify(proj.name));
  return '';
}

// ─── Health Check ──────────────────────────────────────────
async function checkHealth(url) {
  if (!url) return 'unknown';
  try {
    await fetch(url, { mode: 'no-cors', cache: 'no-store' });
    return 'live';
  } catch (e) {
    return 'dead';
  }
}
async function checkProjectHealth(proj) {
  if (!proj.publicUrls.kong && !proj.publicUrls.studio) return;
  document.getElementById('healthStatus').innerHTML = '<span class="health-pill checking">⟳ Checking...</span>';
  const [kongHealth, studioHealth] = await Promise.all([
    checkHealth(proj.publicUrls.kong),
    checkHealth(proj.publicUrls.studio)
  ]);
  proj.health = { kong: kongHealth, studio: studioHealth };
  proj.healthAt = new Date().toISOString();
  save();
  renderSidebar();
  renderHealth();
}

// ─── Output Generation ─────────────────────────────────────
function generateOutput(proj) {
  const lines = [];
  lines.push('# ── 🔵 Hub Hostnames ──────────────────────────────────────');
  HOSTNAME_KEYS.forEach(k => {
    const v = state.hub.hostnames[k];
    if (v) lines.push(`${k}=${v}`);
  });
  lines.push('');
  lines.push('# ── 🟢 Shared Secrets ────────────────────────────────────');
  [...Object.keys(state.hub.shared), ...Object.keys(state.hub.other)].sort().forEach(k => {
    const v = state.hub.shared[k] || state.hub.other[k];
    if (v) lines.push(`${k}=${v}`);
  });
  lines.push('');
  lines.push('# ── 🟡 Per-Sibling Config ────────────────────────────────');
  [...AUTO_KEYS, ...OVERRIDE_KEYS].forEach(k => {
    const v = getOverrideOrAuto(k, proj);
    if (v) lines.push(`${k}=${v}`);
  });
  return lines.join('\n');
}

// ─── Renderers ─────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('projectList');
  if (state.projects.length === 0) {
    list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:0.85rem;text-align:center;">No projects yet.<br>Click "+ New Project" above.</div>';
    return;
  }
  list.innerHTML = state.projects.map(p => {
    const statusIcon = getStatusIcon(p);
    const isActive = p.id === state.currentId;
    return `
      <div class="project-item ${isActive ? 'active' : ''}" onclick="selectProject('${p.id}')">
        <span class="status-dot" style="background:${getStatusColor(p)};"></span>
        <div style="flex:1;overflow:hidden;">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">${statusIcon} ${p.deployedAt ? 'deployed' : 'draft'}</div>
        </div>
        <button class="secondary" style="padding:2px 6px;font-size:0.7rem;" onclick="event.stopPropagation();deleteProject('${p.id}')">×</button>
      </div>
    `;
  }).join('');
}
function getStatusColor(p) {
  if (!p.deployedAt) return 'var(--warn)';
  if (p.health.kong === 'live' || p.health.studio === 'live') return 'var(--accent)';
  if (p.health.kong === 'dead' && p.health.studio === 'dead') return 'var(--danger)';
  if (p.health.kong === 'unknown' && p.health.studio === 'unknown') return 'var(--blue)';
  return 'var(--muted)';
}
function getStatusIcon(p) {
  if (!p.deployedAt) return '✏️';
  if (p.health.kong === 'live' || p.health.studio === 'live') return '✅';
  if (p.health.kong === 'dead' && p.health.studio === 'dead') return '❌';
  return '🔵';
}

function renderMain() {
  const main = document.getElementById('main');
  if (!state.currentId) {
    main.innerHTML = `
      <div class="empty-state">
        <h2>No project selected</h2>
        <p>Create a new project or configure your hub first.</p>
        <div class="btn-row" style="justify-content:center;">
          <button onclick="newProject()">+ New Project</button>
          <button class="secondary" onclick="openHubModal()">Configure Hub</button>
        </div>
      </div>`;
    return;
  }
  const proj = state.projects.find(p => p.id === state.currentId);
  if (!proj) return;

  // Hostnames section
  const hostnameRows = HOSTNAME_KEYS.map(k => {
    const v = state.hub.hostnames[k] || '';
    const defaultVal = k === 'POSTGRES_HOSTNAME' ? 'supabase-db'
                     : k === 'MINIO_HOSTNAME' ? 'supabase-minio'
                     : k === 'ANALYTICS_HOSTNAME' ? 'supabase-analytics' : '';
    return `
      <div class="kv-list row">
        <span class="key">${k}</span>
        <span class="val ${v ? '' : 'empty'}">${v ? escapeHtml(v) : `⚠️ missing — fallback: <code>${defaultVal}</code>`}</span>
      </div>`;
  }).join('');
  const hostnameCount = HOSTNAME_KEYS.filter(k => state.hub.hostnames[k]).length;
  const hostnameBadge = `<span class="badge ${hostnameCount === HOSTNAME_KEYS.length ? 'ok' : 'bad'}">${hostnameCount}/${HOSTNAME_KEYS.length} set</span>`;

  // Shared secrets summary
  const sharedRows = [...new Set([...Object.keys(state.hub.shared), ...SHARED_KEYS])].sort().map(k => {
    const v = state.hub.shared[k] || '';
    return `
      <div class="kv-list row">
        <span class="key">${k}</span>
        <span class="val ${v ? '' : 'empty'}">${v ? escapeHtml(maskValue(v)) : '⚠️ not set'}</span>
      </div>`;
  }).join('');

  // Auto fields (yellow)
  const autoFields = AUTO_KEYS.map(k => {
    const auto = getAutoValue(k, proj);
    const override = proj.overrides[k];
    const isOverridden = override !== undefined && override !== '';
    const val = isOverridden ? override : auto;
    return `
      <div class="field">
        <label>${k}</label>
        <input type="text" value="${escapeAttr(val)}" placeholder="auto: ${escapeAttr(auto)}"
          class="${isOverridden ? 'overridden' : 'auto'}"
          oninput="updateField('${k}', this.value, '${proj.id}')">
        <span class="hint-icon ${isOverridden ? 'ok' : ''}">${isOverridden ? '✎' : '⚡'}</span>
      </div>`;
  }).join('');

  // Override fields
  const overrideFields = OVERRIDE_KEYS.map(k => {
    const val = getOverrideOrAuto(k, proj);
    const isAuto = !proj.overrides[k];
    return `
      <div class="field">
        <label>${k}</label>
        <input type="text" value="${escapeAttr(val)}" placeholder="${escapeAttr(getPlaceholder(k, proj))}"
          oninput="updateField('${k}', this.value, '${proj.id}')">
        <span class="hint-icon ${isAuto ? 'warn' : 'ok'}">${isAuto ? '⚡' : '✎'}</span>
      </div>`;
  }).join('');

  // Live preview lines
  const previewLines = [...AUTO_KEYS, ...OVERRIDE_KEYS].map(k => {
    const val = getOverrideOrAuto(k, proj);
    const isOverride = proj.overrides[k] !== undefined && proj.overrides[k] !== '';
    const isAuto = AUTO_KEYS.includes(k) && !isOverride;
    const cls = !val ? 'empty' : isOverride ? 'override' : isAuto ? 'auto' : '';
    return `<div class="line"><span class="key">${k}</span><span class="val ${cls}">${val || '(empty)'}</span></div>`;
  }).join('');

  // Health
  const healthPill = (status) => {
    const cls = status === 'live' ? 'live' : status === 'dead' ? 'dead' : status === 'checking' ? 'checking' : 'unknown';
    const icon = status === 'live' ? '●' : status === 'dead' ? '✕' : status === 'checking' ? '⟳' : '?';
    return `<span class="health-pill ${cls}">${icon} ${status}</span>`;
  };

  main.innerHTML = `
    <div class="main-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <input type="text" value="${escapeAttr(proj.name)}" 
               style="background:transparent;border:none;color:var(--text);font-size:1.4rem;font-weight:600;width:300px;"
               oninput="updateName(this.value, '${proj.id}')">
        <input type="text" value="${escapeAttr(proj.slug)}" 
               style="background:transparent;border:none;color:var(--muted);font-size:0.95rem;font-family:'SF Mono',monospace;width:140px;"
               oninput="updateSlug(this.value, '${proj.id}')">
      </div>
      <div class="actions">
        <button onclick="copyOutput()">Copy Env Vars</button>
        <button class="secondary" onclick="markDeployed('${proj.id}')">${proj.deployedAt ? 'Update Deploy' : 'Mark Deployed'}</button>
      </div>
    </div>

    <div class="section hostnames">
      <h3>🔵 Hub Hostnames ${hostnameBadge}</h3>
      <div class="hint" style="margin-bottom:8px;">${hostnameCount < HOSTNAME_KEYS.length ? '⚠️ Some hostnames missing — sibling will fall back to standalone defaults and fail to connect to hub.' : 'All hostnames configured. Sibling will connect to hub via predefined network.'}</div>
      <div class="kv-list">${hostnameRows}</div>
    </div>

    <div class="section shared">
      <h3>🟢 Shared Secrets <span class="badge ${Object.keys(state.hub.shared).length > 0 ? 'ok' : 'bad'}">${Object.keys(state.hub.shared).length} set</span></h3>
      <div class="hint" style="margin-bottom:8px;">Copied from hub once, reused across all siblings. Masked for security.</div>
      <div class="kv-list">${sharedRows}</div>
    </div>

    <div class="section sibling">
      <h3>🟡 Per-Sibling Config <span class="badge info">Auto-generated from name</span></h3>
      <div class="hint" style="margin-bottom:10px;">Yellow fields auto-generate from project name. Edit to override (turns green).</div>
      ${autoFields}
      <div style="margin-top:14px;"></div>
      ${overrideFields}
      <div style="margin-top:16px;">
        <h3 style="margin-bottom:6px;">Live Preview</h3>
        <div class="preview">${previewLines}</div>
      </div>
    </div>

    <div class="section urls">
      <h3>🌐 Public URLs <span class="badge ${proj.publicUrls.kong || proj.publicUrls.studio ? 'ok' : 'info'}">${(proj.publicUrls.kong ? 1 : 0) + (proj.publicUrls.studio ? 1 : 0)}/2 set</span></h3>
      <div class="hint" style="margin-bottom:10px;">After deploying in Coolify, paste the assigned URLs here for health checking.</div>
      <div class="field">
        <label>Kong URL</label>
        <input type="text" value="${escapeAttr(proj.publicUrls.kong)}" placeholder="https://api.${proj.slug}.5sites.co"
               oninput="updatePublicUrl('kong', this.value, '${proj.id}')">
        <span id="healthKongPill">${healthPill(proj.health.kong)}</span>
      </div>
      <div class="field">
        <label>Studio URL</label>
        <input type="text" value="${escapeAttr(proj.publicUrls.studio)}" placeholder="https://studio.${proj.slug}.5sites.co"
               oninput="updatePublicUrl('studio', this.value, '${proj.id}')">
        <span id="healthStudioPill">${healthPill(proj.health.studio)}</span>
      </div>
      <div class="btn-row">
        <button class="warn" onclick="checkProjectHealth(state.projects.find(p=>p.id==='${proj.id}'))">Run Health Check</button>
      </div>
      <div id="healthStatus" style="margin-top:8px;"></div>
    </div>

    <div class="section output">
      <h3>📋 Output <span class="badge info">Paste to Coolify</span></h3>
      <textarea class="output" id="outputText" readonly>${generateOutput(proj)}</textarea>
      <div class="btn-row">
        <button onclick="copyOutput()">Copy to Clipboard</button>
        <button class="secondary" onclick="downloadOutput('${proj.id}')">Download .env</button>
      </div>
    </div>
  `;
}

function render() {
  renderSidebar();
  renderMain();
}

function renderHealth() {
  const proj = state.projects.find(p => p.id === state.currentId);
  if (!proj) return;
  const kongPill = document.getElementById('healthKongPill');
  const studioPill = document.getElementById('healthStudioPill');
  if (kongPill) kongPill.innerHTML = `<span class="health-pill ${proj.health.kong === 'live' ? 'live' : proj.health.kong === 'dead' ? 'dead' : 'unknown'}">${proj.health.kong === 'live' ? '● live' : proj.health.kong === 'dead' ? '✕ dead' : '? unknown'}</span>`;
  if (studioPill) studioPill.innerHTML = `<span class="health-pill ${proj.health.studio === 'live' ? 'live' : proj.health.studio === 'dead' ? 'dead' : 'unknown'}">${proj.health.studio === 'live' ? '● live' : proj.health.studio === 'dead' ? '✕ dead' : '? unknown'}</span>`;
  document.getElementById('healthStatus').innerHTML = proj.healthAt ? `<span class="hint">Last checked: ${new Date(proj.healthAt).toLocaleString()}</span>` : '';
}

// ─── Project Field Updates ─────────────────────────────────
function updateName(val, id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  proj.name = val;
  proj.slug = slugify(val);
  save();
  renderSidebar();
  renderMain();
}
function updateSlug(val, id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  proj.slug = slugify(val);
  save();
  renderMain();
}
function updateField(key, val, id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  if (val === '' || val === getAutoValue(key, proj)) {
    delete proj.overrides[key];
  } else {
    proj.overrides[key] = val;
  }
  save();
  renderMain();
}
function updatePublicUrl(which, val, id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  proj.publicUrls[which] = val;
  save();
}
function markDeployed(id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  proj.deployedAt = new Date().toISOString();
  save();
  render();
  toast('Marked as deployed');
}

// ─── Output Actions ────────────────────────────────────────
function copyOutput() {
  const out = document.getElementById('outputText');
  if (!out) return;
  out.select();
  document.execCommand('copy');
  toast('Copied to clipboard');
}
function downloadOutput(id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  const blob = new Blob([generateOutput(proj)], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${proj.slug}.env`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── Helpers ───────────────────────────────────────────────
function maskValue(v) {
  if (!v) return '';
  if (v.length < 12) return '••••';
  return v.slice(0, 4) + '••••' + v.slice(-4);
}
function getPlaceholder(key, proj) {
  if (key === 'API_EXTERNAL_URL') return state.urlPattern.replace('{slug}', proj.slug);
  if (key === 'GOTRUE_SITE_URL') return state.sitePattern.replace('{slug}', proj.slug);
  if (key === 'SERVICE_PASSWORD_ADMIN') return 'auto-generate random';
  if (key === 'ADDITIONAL_REDIRECT_URLS') return state.sitePattern.replace('{slug}', proj.slug) + '/auth/callback';
  return '';
}
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}
function clearAll() {
  if (!confirm('Reset everything? All projects and hub config will be lost.')) return;
  localStorage.removeItem('supa-sibling-manager');
  state = {
    hub: { hostnames: {}, shared: {}, other: {} },
    projects: [],
    currentId: null,
    urlPattern: 'https://api.{slug}.5sites.co',
    sitePattern: 'https://app.{slug}.5sites.co'
  };
  render();
}

// ─── Init ──────────────────────────────────────────────────
load();
render();
</script>

</body>
</html>
